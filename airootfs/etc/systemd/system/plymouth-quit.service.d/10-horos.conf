# HorOS: Plymouth splash'ını kurulum arayüzü çizilene kadar açık tut.
# Varsayılan quit, getty@tty1 ile aynı anda çalışır ve kısa bir siyah boşluk
# oluşur. Gerçek quit /usr/local/bin/horos içinde, TUI başlamadan hemen önce
# yapılır; böylece spinner -> installer geçişi kesintisiz olur.
[Service]
ExecStart=
ExecStart=/usr/bin/true
