# HorOS: tty1'de login/getty yerine doğrudan kurulum arayüzü açılır.
# Ekranda issue, motd, "Last login" gibi yazılar çıkmaz; installer doğrudan görünür.
[Service]
ExecStart=
ExecStart=/usr/local/bin/horos
# idle would wait for reflector/pacman-init to finish before showing the TUI.
# Start immediately; prepare_pacman waits for those units when install begins.
Type=simple
Environment=TERM=linux
Environment=HOME=/root
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
Restart=always
RestartSec=0
