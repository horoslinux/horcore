# HorOS: tty1'de login/getty yerine doğrudan kurulum arayüzü açılır.
# Plymouth kapanınca (getty@.service plymouth-quit-wait'ten sonra başlar) ekranda
# issue, motd, "Last login" gibi hiçbir yazı çıkmaz; installer doğrudan görünür.
[Service]
ExecStart=
ExecStart=/usr/local/bin/horos
Type=idle
Environment=TERM=linux
Environment=HOME=/root
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
Restart=always
RestartSec=0
