#!/usr/bin/nft -f
# HorOS Linux güvenlik duvarı: gelen bağlantılar varsayılan olarak KAPALI.
# Profil dosyaları /etc/nftables.d/*.nft içinden portları açar.
#
# Bir TCP portu açmak için /etc/nftables.d/ altına bir .nft dosyası ekle:
#   add element inet horos tcp_in { 443 }
# UDP için tcp_in yerine udp_in. Uygulamak: systemctl restart nftables
#
# Not: forward zinciri bilinçli olarak tanımlı değil (Docker/libvirt kendi kurallarını yönetir).

flush ruleset

table inet horos {
  set tcp_in {
    type inet_service
  }
  set udp_in {
    type inet_service
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state { established, related } accept
    iifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    tcp dport @tcp_in accept
    udp dport @udp_in accept
  }
}

include "/etc/nftables.d/*.nft"
